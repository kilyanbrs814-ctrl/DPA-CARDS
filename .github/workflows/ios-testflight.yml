name: Upload signed iOS build to TestFlight

# User-requested one-off signed iOS upload; limit the push trigger to changes to this workflow.
# Only runs after Apple signing materials are configured in GitHub Actions secrets.
on:
  workflow_dispatch:
  push:
    branches: [feat/ios-app-store-preparation]
    paths:
      - .github/workflows/ios-testflight.yml

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: fr.digitalprojectagency.cards
      APP_TEAM_ID: HDK7R3283T
      CERT_B64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
      ASC_API_KEY_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - name: Check signing configuration
        shell: bash
        run: |
          for name in CERT_B64 CERT_PASSWORD PROFILE_B64 ASC_API_KEY_B64 ASC_API_KEY_ID ASC_API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required iOS signing secret: $name"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        with:
          ref: feat/ios-app-store-preparation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build web and generate iOS project
        run: |
          npm ci
          npm install --no-save --package-lock=false @capacitor/core@8 @capacitor/cli@8 @capacitor/ios@8 @capacitor/app@8
          npm run build
          npm run test:static
          node --test scripts/check-native-admin-link.test.mjs
          npx cap add ios
          npx cap sync ios
          swift scripts/make-ios-icon.swift public/assets/dpa-cards-logo.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          swift scripts/configure-ios-deeplink.swift ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName DPA Cards" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string DPA Cards utilise la caméra pour scanner les QR codes des cartes de fidélité des clients." ios/App/App/Info.plist

      - name: Install Apple distribution certificate and App Store profile
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/dpa-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERT_B64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          echo "$PROFILE_B64" | base64 -D > "$RUNNER_TEMP/dpa.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # A PKCS#12 created by OpenSSL 3 on Windows may use a SHA-256 MAC
          # that Apple's Keychain rejects as "wrong password". Verify the secret
          # with OpenSSL first, then try an Apple-compatible SHA-1/3DES container.
          OPENSSL_BIN="$(command -v openssl)"
          if command -v brew >/dev/null 2>&1 && [[ -x "$(brew --prefix openssl@3 2>/dev/null)/bin/openssl" ]]; then
            OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          fi
          if ! "$OPENSSL_BIN" pkcs12 -in "$RUNNER_TEMP/distribution.p12" -noout -passin env:CERT_PASSWORD >/dev/null 2>&1; then
            echo "::error::The iOS P12 and IOS_DISTRIBUTION_P12_PASSWORD do not match, or the P12 is invalid. Recheck both GitHub secrets."
            exit 1
          fi
          if ! security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign; then
            echo "::warning::Keychain rejected the P12; retrying Apple-compatible PKCS12 container."
            # Temporary unencrypted PEM exists only on the isolated ephemeral runner.
            # Never print it or publish it as a build artifact.
            trap 'rm -f "$RUNNER_TEMP/dpa-compatible.pem" "$RUNNER_TEMP/dpa-compatible.p12"' EXIT
            "$OPENSSL_BIN" pkcs12 -in "$RUNNER_TEMP/distribution.p12" -passin env:CERT_PASSWORD -nodes -out "$RUNNER_TEMP/dpa-compatible.pem"
            chmod 600 "$RUNNER_TEMP/dpa-compatible.pem"
            "$OPENSSL_BIN" pkcs12 -export -in "$RUNNER_TEMP/dpa-compatible.pem" -out "$RUNNER_TEMP/dpa-compatible.p12" -passout env:CERT_PASSWORD -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
            security import "$RUNNER_TEMP/dpa-compatible.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/dpa-compatible.pem" "$RUNNER_TEMP/dpa-compatible.p12"
            trap - EXIT
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/dpa.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME="$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")"
          PROFILE_UUID="$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")"
          cp "$RUNNER_TEMP/dpa.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive signed iPhone app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/configure-ios-signing.mjs ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DPA-Cards.xcarchive" \
            MARKETING_VERSION='1.0.0' \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive

      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>teamID</key><string>$APP_TEAM_ID</string>
          <key>provisioningProfiles</key><dict><key>$APP_BUNDLE_ID</key><string>$IOS_PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DPA-Cards.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"
          test -n "$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Upload build to TestFlight via App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_B64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_API_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_API_KEY_ID.p8"
          IPA="$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
