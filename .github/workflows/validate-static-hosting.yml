name: Validate static hosting
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:static
      - run: npm run test:apple
      - run: npm run test:real-apple
      - run: node --test scripts/check-dual-logo-wallet.test.mjs
      - run: npm run test:apple-updates
      - run: npm run test:apple-strip
      - run: npm run test:emoji
      - run: node --test scripts/check-reward-and-admin-scanner.test.mjs
      - run: node --test scripts/check-demo-activation.test.mjs
      - run: node --test scripts/check-onsite-migration.test.mjs
      - run: npm run test:png
      - run: npm run test:profiles
      - run: npx playwright install --with-deps chromium
      - run: npm run test:png-ui
      - run: npm run test:profiles-ui
      - run: npm run test:wallet-surfaces
      - run: npm run test:wallet-recovery
      - run: npm run test:onboarding-logo

  edge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=auto supabase/functions/wallet/index.ts supabase/functions/apple-pass/index.ts supabase/functions/billing/index.ts
