name: Préparer la fiche App Store française
on:
  push:
    branches: [ops/app-store-fr-2026-11-23]
permissions:
  contents: read
  actions: write
jobs:
  french-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_STORE_APP_ID: '6823642562'
      MARKETING_VERSION: '1.3'
      ASC_API_KEY_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-app-store-fr.mjs
      - name: Donner la priorité au build TestFlight
        uses: actions/github-script@v7
        with:
          script: |
            const branches=new Set(['main','codex/dpa-cards-1-3-launch','codex/ios-runner-availability']);
            for (const status of ['in_progress','queued']) {
              const {data}=await github.rest.actions.listWorkflowRunsForRepo({...context.repo,status,per_page:100});
              for (const run of data.workflow_runs) {
                if (run.name==='Validate current DPA Cards iPhone app' && branches.has(run.head_branch)) {
                  try {
                    await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id});
                    core.info('Validation simulateur redondante annulée '+run.id);
                  } catch (error) {
                    if(error.status!==409)throw error;
                  }
                }
              }
            }
