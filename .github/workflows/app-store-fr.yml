name: Préparer la fiche App Store française
on:
  push:
    branches: [ops/app-store-fr-2026-11-23]
permissions:
  contents: read
  actions: write
jobs:
  french-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_STORE_APP_ID: '6823642562'
      MARKETING_VERSION: '1.3'
      ASC_API_KEY_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-app-store-fr.mjs
      - name: Annuler le build resté en attente de runner
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 45220790189;
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId});
            if (run.head_branch !== 'release/testflight-1.3-2026-11-23-complete') throw new Error('Unexpected workflow branch');
            if (!['completed'].includes(run.status)) {
              await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:runId});
              core.info('Build en attente annulé avant la relance sur le runner disponible.');
            }
