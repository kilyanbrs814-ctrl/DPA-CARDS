name: Import loyalty stamp PNGs once
on:
  push:
    branches: [feature/png-stamp-library-20261015]
    paths: ['.github/workflows/import-stamps-once.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Import the 33 authorized PNG stamps
        env:
          ARCHIVE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3EqFLTgGrEqfcX6D4PlpZJ7PV26/cbb2e47e-c0a7-4c07-ba8b-8db0b59a3d41.zip
        run: |
          python -m pip install --quiet Pillow==11.3.0
          python - <<'PY'
          import hashlib, io, os, pathlib, urllib.request, zipfile
          from PIL import Image
          url = os.environ['ARCHIVE_URL']
          with urllib.request.urlopen(url,timeout=60) as response:
              archive = response.read(40000000)
          assert hashlib.sha256(archive).hexdigest() == '9a91ddfa82ecd6f04ab62aee9e4d901d897748b83e4049ce818ff077cc93ff89', 'archive digest mismatch'
          names=['pizza','baguette','glace','donut','riz-crousty','ciseaux','fleuriste','barber','burger','the','carwash','spa','vernis','patte','fitness','poulet','bubble-tea','tacos','kebab','sushi','crepe','croissant','cafe','milkshake','cookie','maquillage','sneaker','shopping','bijouterie','vetements','telephonie','pneumatique','animalerie']
          out=pathlib.Path('public/assets/stamps');out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              files=[p for p in z.namelist() if p.lower().endswith('.png')]
              assert len(files)==len(names)==33
              for name,filename in zip(names,files):
                  im=Image.open(io.BytesIO(z.read(filename))).convert('RGBA')
                  assert im.width<=4096 and im.height<=4096
                  # Remove almost-transparent generator edge speckles before fitting.
                  a=im.getchannel('A');box=a.point(lambda v: 255 if v>12 else 0).getbbox()
                  if not box: raise ValueError('Empty stamp '+name)
                  im=im.crop(box);im.thumbnail((244,244),Image.Resampling.LANCZOS)
                  result=Image.new('RGBA',(256,256),(0,0,0,0))
                  result.alpha_composite(im,((256-im.width)//2,(256-im.height)//2))
                  result.save(out/(name+'.png'),format='PNG',optimize=True)
          print('Imported',len(names),'transparent 256px PNG stamps')
          PY
      - name: Commit PNGs to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/stamps
          if ! git diff --cached --quiet; then
            git commit -m "assets: import 33 customer-provided loyalty stamps"
            git push
          fi
