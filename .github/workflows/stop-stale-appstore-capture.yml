name: Stop superseded App Store capture
on:
  push:
    branches: [work/appstore-assets]
    paths: [.github/workflows/stop-stale-appstore-capture.yml]
permissions:
  contents: read
  actions: write
jobs:
  stop-old-job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the superseded screenshot run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.github.com/repos/kilyanbrs814-ctrl/DPA-CARDS/actions/runs/39477331538';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const r=await fetch(root,{headers});if(!r.ok)throw Error('Cannot read old run: '+r.status);
          const run=await r.json();
          if(run.head_sha!=='f3ee7c6901734570bd2307267ef82166285b035a'||run.path!=='.github/workflows/app-store-assets.yml')throw Error('Unexpected run; cancellation refused');
          if(run.status==='completed'){console.log('Old capture already finished.');process.exit(0);}
          const c=await fetch(root+'/cancel',{method:'POST',headers});
          if(c.status!==202)throw Error('Cancel returned '+c.status);
          console.log('Superseded screenshot run cancellation requested.');
          NODE
