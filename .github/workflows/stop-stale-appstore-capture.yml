name: Stop superseded App Store capture
on:
  push:
    branches: [work/appstore-assets]
    paths: [.github/workflows/stop-stale-appstore-capture.yml]
permissions:
  contents: read
  actions: write
jobs:
  stop-old-job:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.github.com/repos/kilyanbrs814-ctrl/DPA-CARDS/actions/runs/39481697651';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const r=await fetch(url,{headers});if(!r.ok)throw Error('Read failed');const run=await r.json();
          if(run.head_sha!=='133be6d0d4b91cde2d1b13cc88a21ba7d134a20a'||run.path!=='.github/workflows/app-store-assets.yml')throw Error('Unexpected run');
          if(run.status==='completed')process.exit(0);
          const c=await fetch(url+'/cancel',{method:'POST',headers});if(![202,204].includes(c.status))throw Error('Cancel status '+c.status);
          console.log('Superseded runner cancellation requested.');
          NODE
