name: Capture DPA Cards iOS 1.1 (21)

on:
  push:
    branches: [captures/app-store-ios-1-1-21]

permissions:
  contents: read

jobs:
  ios-current:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate bundled iOS app
        run: |
          npm install --no-save --package-lock=false @capacitor/core@8 @capacitor/cli@8 @capacitor/ios@8 @capacitor/app@8
          npx cap add ios
          npx cap sync ios
          # Fail the iOS release if the current lavender workspace image was omitted.
          # Both device orientations and both color themes must be bundled.
          for name in dpa-bg-light-mobile dpa-bg-light-desktop dpa-bg-dark-mobile dpa-bg-dark-desktop; do
            test -s "dist/assets/${name}-4k.svg"
            test -s "ios/App/App/public/assets/${name}-4k.svg"
          done
          swift scripts/make-ios-icon.swift public/assets/dpa-cards-logo.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          swift scripts/configure-ios-deeplink.swift ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName DPA Cards" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string DPA Cards utilise la caméra pour scanner les QR codes des cartes de fidélité." ios/App/App/Info.plist
      - name: Compile unsigned iOS Simulator application
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dpa-simulator" -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Capture iPhone and iPad with the app’s demo data
        env:
          APP: ${{ runner.temp }}/dpa-simulator/Build/Products/Debug-iphonesimulator/App.app
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import pathlib
          import subprocess
          import time

          def sim(*args, **kwargs):
              return subprocess.run(["xcrun", "simctl", *args], check=True, **kwargs)

          devices = json.loads(sim("list", "devices", "available", "-j", capture_output=True).stdout)["devices"]
          available = [device for runtime, group in reversed(list(devices.items()))
                       if ".iOS-" in runtime for device in group if device["isAvailable"]]
          models = {
              "iphone": ["iPhone 17 Pro", "iPhone 16 Pro"],
              "ipad": ["iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)"],
          }

          output = pathlib.Path("dpa-app-store-captures")
          output.mkdir()
          app = os.environ["APP"]
          bundle_id = "fr.digitalprojectagency.cards"
          start = "const st=this.props.startScreen; if(st&&st!=='login'){ this.enterDemo(); if(st!=='home') setTimeout(()=>this.go(st),10); }"
          screens = [
              ("01-accueil", "home", "{}"),
              ("02-clients", "clients", "{}"),
              ("03-fiche-client", "client", "{selId:'c2'}"),
              ("04-invitation", "invite", "{}"),
              ("05-reglages", "more", "{}"),
          ]

          def capture(target, names):
              device = next((d for name in names for d in available if d["name"] == name), None)
              if device is None:
                  device = next(d for d in available if (
                      target == "ipad" and d["name"].startswith("iPad Pro 13-inch")
                      or target == "iphone" and d["name"].startswith("iPhone ") and d["name"].endswith(" Pro")
                  ))
              udid = device["udid"]
              print(target, device["name"], flush=True)
              if device["state"] != "Booted":
                  sim("boot", udid)
              sim("bootstatus", udid, "-b")
              sim("status_bar", udid, "override", "--time", "9:41", "--dataNetwork", "wifi", "--wifiMode", "active", "--wifiBars", "3", "--cellularMode", "active", "--cellularBars", "4", "--batteryState", "unplugged", "--batteryLevel", "100")
              sim("ui", udid, "appearance", "light")
              sim("install", udid, app)
              installed = pathlib.Path(sim("get_app_container", udid, bundle_id, "app", capture_output=True, text=True).stdout.strip())
              index = installed / "public/index.html"
              original = index.read_text()
              if original.count(start) != 1:
                  raise RuntimeError("Could not identify the app’s built-in demo entry point")
              for name, screen, state in screens:
                  replacement = "const st='home'; if(st){ this.enterDemo(); setTimeout(()=>this.go(" + repr(screen) + "," + state + "),1100); }"
                  index.write_text(original.replace(start, replacement))
                  sim("launch", "--terminate-running-process", udid, bundle_id)
                  time.sleep(7)
                  sim("io", udid, "screenshot", str(output / f"dpa-{target}-{name}.png"))
              sim("terminate", udid, bundle_id)

          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as executor:
              futures = [executor.submit(capture, target, names) for target, names in models.items()]
              for future in futures:
                  future.result()
          PY
      - name: Upload App Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dpa-cards-ios-1-1-build-21-screenshots
          path: dpa-app-store-captures/*.png
          if-no-files-found: error
