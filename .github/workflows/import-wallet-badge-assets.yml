name: Import wallet badge artwork (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-wallet-badge-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download supplied Apple and Google Wallet button PNGs
        run: |
          set -euo pipefail
          mkdir -p public/assets
          curl -fL --retry 3 --proto '=https' --tlsv1.2 --output public/assets/wallet-badge-google.png 'https://d2ol7oe51mr4n9.cloudfront.net/user_3EqFLTgGrEqfcX6D4PlpZJ7PV26/6da8cc91-0714-4003-bfed-da8d2efc1c2c.png'
          curl -fL --retry 3 --proto '=https' --tlsv1.2 --output public/assets/wallet-badge-apple.png 'https://d2ol7oe51mr4n9.cloudfront.net/user_3EqFLTgGrEqfcX6D4PlpZJ7PV26/6b9d9bcf-48bc-4955-99b3-6039e520b7f6.png'
          echo '4ac96a57c767574cedcc4d39add07940c8f366c37242577492ea38b9aed52cdf  public/assets/wallet-badge-google.png' | sha256sum -c -
          echo '46c92f6c947c2dc7aa70ddfd6b5bbc8ed80238f98861742e70361c7d836b5c1c  public/assets/wallet-badge-apple.png' | sha256sum -c -
      - name: Commit original assets (no conversion)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/wallet-badge-google.png public/assets/wallet-badge-apple.png
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "assets: add supplied Apple and Google Wallet buttons"
          git push origin HEAD:main
