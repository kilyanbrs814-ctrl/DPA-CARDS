name: Compiler DPA Cards pour Windows
on:
  push:
    branches: [codex/dpa-cards-1-3-launch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler le lanceur
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public/downloads | Out-Null
          & "$env:WINDIR/Microsoft.NET/Framework/v4.0.30319/csc.exe" /nologo /target:winexe /reference:System.Windows.Forms.dll /out:public/downloads/DPA-Cards-Windows.exe desktop/windows/DpaCards.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ajouter le binaire à la branche de lancement
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/dpa-cards-1-3-launch'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/downloads/DPA-Cards-Windows.exe
          git diff --cached --quiet && exit 0
          git commit -m 'Ajouter le binaire Windows compilé'
          git push origin HEAD:refs/heads/codex/dpa-cards-1-3-launch
      - uses: actions/upload-artifact@v4
        with:
          name: DPA-Cards-Windows
          path: public/downloads/DPA-Cards-Windows.exe
          if-no-files-found: error
