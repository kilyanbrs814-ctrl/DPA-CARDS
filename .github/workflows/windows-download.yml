name: Compiler DPA Cards pour Windows
on:
  push:
    branches: [codex/dpa-cards-1-3-launch]
    paths:
      - desktop/windows/**
      - .github/workflows/windows-download.yml
      - .github/guide-download-url.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler et vérifier le téléchargement Windows
        shell: pwsh
        run: |
          $sourcePath = (Resolve-Path 'desktop/windows/DpaCards.cs').Path
          $downloadsPath = Join-Path $PWD 'public/downloads'
          New-Item -ItemType Directory -Force $downloadsPath | Out-Null
          $binaryPath = Join-Path $downloadsPath 'DPA-Cards-Windows.exe'
          $compilerPath = Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          & $compilerPath /nologo /target:winexe /reference:System.Windows.Forms.dll "/out:$binaryPath" $sourcePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = [IO.File]::ReadAllBytes($binaryPath)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows executable' }
      - name: Intégrer le guide existant
        shell: pwsh
        run: |
          if (Test-Path '.github/guide-download-url.txt') {
            $guideUrl = (Get-Content '.github/guide-download-url.txt' -Raw).Trim()
            Write-Output "::add-mask::$guideUrl"
            Invoke-WebRequest -Uri $guideUrl -OutFile 'public/downloads/Guide-DPA-Cards-mobile.pdf'
            $header = [IO.File]::ReadAllBytes((Join-Path $PWD 'public/downloads/Guide-DPA-Cards-mobile.pdf'))
            if ([Text.Encoding]::ASCII.GetString($header,0,4) -ne '%PDF') { throw 'Invalid PDF' }
            Remove-Item -LiteralPath '.github/guide-download-url.txt'
          }
      - name: Enregistrer les fichiers téléchargeables
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/downloads/
          git add -u .github/
          git diff --cached --quiet && exit 0
          git commit -m 'Publier le binaire Windows et le guide PDF'
          git push origin HEAD:refs/heads/codex/dpa-cards-1-3-launch
      - uses: actions/upload-artifact@v4
        with:
          name: DPA-Cards-telechargements
          path: public/downloads/
          if-no-files-found: error
