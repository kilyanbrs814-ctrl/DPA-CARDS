<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;border-radius:16px;background:{{ c.bg }};color:{{ c.fg }};overflow:hidden;box-shadow:0 12px 32px rgba(20,22,28,0.14), 0 1px 3px rgba(20,22,28,0.08);font-family:'Hanken Grotesk',sans-serif">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px">
    <div style="display:flex;align-items:center;gap:10px;min-width:0">
      <div style="width:38px;height:38px;border-radius:10px;background:{{ c.accent }};color:{{ c.accentFg }};display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:0.04em;flex:none">{{ c.logo }}</div>
      <div style="font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.business }}</div>
    </div>
    <div style="text-align:right;flex:none">
      <div style="font-weight:700;font-size:10px;letter-spacing:0.08em;color:{{ c.muted }}">{{ c.unit }}</div>
      <div style="font-weight:800;font-size:20px;line-height:1.1;margin-top:3px;font-variant-numeric:tabular-nums">{{ c.value }}</div>
    </div>
  </div>
  <div style="padding:0 16px 12px;font-weight:800;font-size:22px;letter-spacing:-0.01em;line-height:1.15">{{ c.program }}</div>
  <sc-if value="{{ c.showBanner }}" hint-placeholder-val="{{ true }}">
    <div style="height:72px;background:{{ c.banner }};border-top:1px solid {{ c.line }};border-bottom:1px solid {{ c.line }}"></div>
  </sc-if>
  <div style="display:flex;justify-content:space-between;gap:16px;padding:12px 16px 14px">
    <div style="min-width:0">
      <div style="font-weight:700;font-size:10px;letter-spacing:0.08em;color:{{ c.muted }}">RÉCOMPENSE</div>
      <div style="font-weight:600;font-size:15px;margin-top:4px">{{ c.reward }}</div>
    </div>
    <div style="text-align:right;min-width:0">
      <div style="font-weight:700;font-size:10px;letter-spacing:0.08em;color:{{ c.muted }}">MEMBRE</div>
      <div style="font-weight:600;font-size:15px;margin-top:4px;white-space:nowrap">{{ c.member }}</div>
    </div>
  </div>
  <sc-if value="{{ c.showQr }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 16px 18px">
      <div style="background:#FFFFFF;padding:8px;border-radius:10px;line-height:0">{{ c.qr }}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.04em;color:{{ c.muted }}">{{ c.cardNo }}</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:460},&quot;c&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
